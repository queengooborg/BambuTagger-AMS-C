# ============================================================
#  BambuTagger-AMS-C — Automatic Build & Release (PlatformIO)
#  Compiles the ESP32 firmware and publishes a GitHub Release
#  every time a version tag (v*) is pushed.
#  A normal push to main only compiles (smoke-test, no release).
# ============================================================

name: Build & Release

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32 Dev Module
            board: esp32dev
            chip: esp32
            offset: 0x1000
          - name: ESP32-S3-DevKitC-1
            board: esp32-s3-devkitc-1
            chip: esp32s3
            offset: 0x0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Build firmware
        run: pio run -e "${{ matrix.board }}"

      - name: Prepare build artifacts
        run: |
          mkdir -p build
          cp ".pio/build/${{ matrix.board }}/firmware.bin" "build/${{ matrix.board }}-firmware.bin"
          cp ".pio/build/${{ matrix.board }}/bootloader.bin" "build/${{ matrix.board }}-bootloader.bin"
          cp ".pio/build/${{ matrix.board }}/partitions.bin" "build/${{ matrix.board }}-partitions.bin"
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin build/boot_app0.bin

      - name: Create merged binaries
        run: |
          esptool --chip "${{ matrix.chip }}" merge-bin \
            --output "build/${{ matrix.board }}-firmware_merged.bin" \
            --flash-mode qio \
            --flash-freq 80m \
            --flash-size keep \
            ${{ matrix.offset }}   "build/${{ matrix.board }}-bootloader.bin" \
            0x8000   "build/${{ matrix.board }}-partitions.bin" \
            0xe000   build/boot_app0.bin \
            0x10000  "build/${{ matrix.board }}-firmware.bin"

          echo "=== Build artifacts ==="
          ls -lh build/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BambuTagger-AMS-C-firmware-${{ matrix.board }}-${{ github.sha }}
          retention-days: 30
          path: build/${{ matrix.board }}-*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BambuTagger-AMS-C-firmware-*-${{ github.sha }}
          path: build
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            build/*
          body: |
            ## Flashing instructions

            To flash the image onto your board, first, download the image matching your board:
            - ESP-WROOM-32 / ESP32 Dev Module - `esp32dev-firmware_merged.bin`
            - ESP32-S3-DevKitC-1 - `esp32-s3-devkitc-1-firmware_merged.bin` (requires `--chip esp32s3` in commands)

            Then, you can flash the firmware by either:
            - Uploading the file to [ESPFlasher.app](https://espflasher.app/)
            - Writing the flash using `esptool` (`esptool write-flash 0x0 firmware_merged.bin`)

            ### Manual

            Use the matching board-prefixed `bootloader`, `partitions`, and `firmware` files.

            #### ESP-WROOM-32

            ```
            esptool write-flash \
              0x1000   bootloader.bin \
              0x8000   partitions.bin \
              0x10000  firmware.bin
            ```

            #### ESP32-S3-DevKitC-1

            ```
            esptool --chip esp32s3 write-flash \
              0x0      bootloader.bin \
              0x8000   partitions.bin \
              0x10000  firmware.bin
            ```
